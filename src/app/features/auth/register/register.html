<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-slate-200">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Crear Cuenta</h2>
    
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1">Correo Electrónico</label>
        <input type="email" [(ngModel)]="email" name="email" required
               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none">
      </div>
      
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1">Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required
               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none">
      </div>

      @if (errorMessage()) {
        <div class="bg-rose-50 text-rose-600 p-3 rounded-lg text-sm font-medium border border-rose-100">
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" [disabled]="isLoading()"
              class="w-full bg-teal-800 hover:bg-teal-900 text-white font-bold py-3 rounded-xl transition-colors disabled:opacity-50">
        {{ isLoading() ? 'Cargando...' : 'Registrarse' }}
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      ¿Ya tienes cuenta? 
      <a routerLink="/login" class="text-teal-700 font-bold hover:underline">Inicia sesión</a>
    </p>
  </div>
</div>
